<section class="hero">
    <div class="hero-bg">
        <img src="https://images.unsplash.com/photo-1613490493576-7fde63acd811?w=1920&q=80" alt="Modern home with pool">
    </div>

    <div class="container hero-content">
        <div class="hero-text">
            <span class="hero-badge">
                <i class="fa-solid fa-house"></i>
                Dream &bull; Search &bull; Own
            </span>

            <h1>
                Discover Spaces<br>
                That Feel Like
                <span class="highlight">
                    Home
                    <svg class="highlight-swoosh" viewBox="0 0 220 20" preserveAspectRatio="none">
                        <path d="M4,4 C60,16 150,20 216,4" fill="none" stroke="currentColor" stroke-width="5"
                            stroke-linecap="round" vector-effect="non-scaling-stroke" />
                    </svg>
                </span>
            </h1>

            <p>Find handpicked properties for rent or sale that match your lifestyle and budget.</p>
        </div>

        <div class="trust-badge">
            <div class="avatars">
                <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Customer">
                <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Customer">
                <img src="https://randomuser.me/api/portraits/women/68.jpg" alt="Customer">
            </div>
            <span>Trusted by 25K+<br><strong>Happy Families</strong></span>
        </div>
    </div>

    <div class="container">
        <form class="search-bar" id="searchBar">
            <div class="search-field">
                <i class="fa-solid fa-location-dot"></i>
                <div>
                    <label>Location</label>
                    <select>
                        <option>New York, USA</option>
                        <option>Chicago, USA</option>
                        <option>Austin, USA</option>
                        <option>Miami, USA</option>
                    </select>
                </div>
            </div>

            <div class="search-field">
                <i class="fa-solid fa-house"></i>
                <div>
                    <label>Property Type</label>
                    <select>
                        <option>Any Type</option>
                        <option>Villa</option>
                        <option>Apartment</option>
                        <option>House</option>
                    </select>
                </div>
            </div>

            <div class="search-field">
                <i class="fa-solid fa-dollar-sign"></i>
                <div>
                    <label>Price Range</label>
                    <select>
                        <option>$1,000 - $5,000</option>
                        <option>$5,000 - $10,000</option>
                        <option>$10,000+</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                Search
            </button>
        </form>
    </div>
</section>
